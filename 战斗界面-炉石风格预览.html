<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>金榜题名｜战斗界面风格预览</title>
  <style>
    @font-face{font-family:gameTitle;src:url('金榜题名v0.17.4/字体/优设标题黑.ttf')}*{box-sizing:border-box}body{margin:0;min-width:980px;min-height:100vh;display:grid;place-items:center;overflow:auto;color:#f7efd9;font-family:gameTitle,"Microsoft YaHei",sans-serif;background:#08111f url('金榜题名v0.17.4/其他插画/教室战斗背景.png') center/cover fixed}.arena{position:relative;width:min(1500px,100vw);height:min(844px,100vh);min-height:720px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,rgba(99,174,217,.22),transparent 37%),linear-gradient(110deg,rgba(6,18,35,.92),rgba(24,38,59,.64),rgba(7,15,29,.91));box-shadow:0 0 55px #000b}.arena:before{content:"";position:absolute;inset:2.2%;border:3px solid #9c7540;border-radius:46% 46% 38% 38%/24% 24% 34% 34%;box-shadow:inset 0 0 60px #0009,0 0 0 9px #1b2631,0 0 0 12px #6a4c2c;pointer-events:none}.arena:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,#78eaff33 0 3px,transparent 4px),radial-gradient(circle at 83% 18%,#ffd66d44 0 2px,transparent 3px),radial-gradient(circle at 74% 80%,#85dcff35 0 2px,transparent 4px);background-size:110px 130px;opacity:.8;pointer-events:none}.topline{position:absolute;z-index:5;top:16px;left:35px;right:35px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#d8e8f2;text-shadow:0 2px 2px #000}.mark{letter-spacing:4px;color:#f6cd7c}.turn{padding:6px 16px;border:1px solid #c99a51;border-radius:20px;background:#152337cc;color:#f9df9d}.portrait{position:absolute;z-index:4;width:138px;text-align:center}.enemy{top:42px;left:50%;transform:translateX(-50%)}.player{bottom:104px;left:50%;transform:translateX(-50%)}.frame{width:104px;height:104px;margin:auto;padding:5px;border:4px solid #bf9050;border-radius:50%;background:linear-gradient(135deg,#303846,#161c2a);box-shadow:0 0 0 4px #1a2230,0 6px 16px #000b;overflow:hidden}.frame img{width:100%;height:100%;object-fit:cover;border-radius:50%}.portrait .name{display:inline-block;margin-top:6px;padding:3px 13px;border-radius:12px;background:#0b1423dd;border:1px solid #9d7641;font-size:14px}.health{position:absolute;right:-7px;bottom:13px;display:grid;place-items:center;width:38px;height:38px;border-radius:48% 48% 52% 52%;background:radial-gradient(circle at 30% 26%,#ff8080,#ab192b 54%,#5e0914);border:2px solid #f4cfad;color:#fff;font-size:16px;text-shadow:0 1px 2px #000}.power{position:absolute;top:38px;width:73px;height:73px;border-radius:50%;border:3px solid #d2a762;background:radial-gradient(circle,#536789,#19263b 67%);box-shadow:0 0 0 3px #17202f;color:#eff7ff;display:grid;place-items:center;font-size:28px}.enemy .power{left:calc(50% + 79px)}.player .power{right:calc(50% + 79px)}.power small{position:absolute;right:-4px;top:-6px;background:#1c5cab;border:2px solid #c9e7ff;border-radius:50%;font-size:13px;padding:2px 5px}.play-zone{position:absolute;z-index:3;left:18%;right:18%;top:226px;bottom:244px;display:grid;place-items:center;border:2px dashed rgba(199,224,239,.48);border-radius:50%;background:radial-gradient(ellipse at center,rgba(54,134,181,.18),rgba(4,14,27,.18) 58%,transparent 71%);box-shadow:inset 0 0 54px #5ba8db22}.play-zone:before{content:"";width:258px;height:258px;border:2px solid #d9b66a88;border-radius:50%;background:url('金榜题名v0.17.4/其他插画/magic_circle.png') center/contain no-repeat;opacity:.78;filter:drop-shadow(0 0 16px #70cfff);animation:slowSpin 24s linear infinite}.play-zone:after{content:"";position:absolute;inset:24px;border-top:1px solid #e8c66d55;border-bottom:1px solid #6ed3ff55;border-radius:50%;pointer-events:none}.play-zone .drop-title{position:absolute;margin-top:8px;padding:8px 19px;border:1px solid #d8b160;border-radius:5px;background:#101d30dc;color:#f2dfae;font-size:17px;letter-spacing:5px;text-shadow:0 2px 2px #000}.play-zone .drop-note{position:absolute;margin-top:57px;font-family:"Microsoft YaHei",sans-serif;font-size:12px;color:#b4cddd}@keyframes slowSpin{to{transform:rotate(360deg)}}.school-badge{position:absolute;z-index:4;left:40px;top:45%;width:98px;height:98px;border:3px solid #bc8a48;border-radius:50%;background:radial-gradient(circle,#43677d,#17273b 60%,#080e18);box-shadow:0 0 23px #6fd6ff55,0 4px 12px #000;display:grid;place-items:center;font-size:43px}.school-badge:after{content:"知识对决";position:absolute;top:104px;font-size:12px;letter-spacing:3px;color:#a8d9ef;white-space:nowrap}.energy{position:absolute;z-index:5;bottom:122px;left:30px;width:156px;height:156px;border:5px solid #bd9651;border-radius:50%;background:radial-gradient(circle,#183457,#0b1528 65%);box-shadow:0 0 0 4px #1b2633,0 5px 20px #000b;display:grid;place-items:center}.energy:before{content:"";position:absolute;inset:10px;border:1px dashed #80d5ff88;border-radius:50%}.energy .value{font-size:37px;color:#bdeaff;text-shadow:0 0 10px #42a8e5}.energy .label{position:absolute;bottom:25px;font-size:11px;color:#d6b973;letter-spacing:3px}.crystals{position:absolute;top:22px;display:flex;gap:4px}.crystal{width:12px;height:17px;clip-path:polygon(50% 0,100% 35%,75% 100%,25% 100%,0 35%);background:#2b4058;border:1px solid #7394b3}.crystal.on{background:linear-gradient(#d9f8ff,#299cea);box-shadow:0 0 9px #6ed6ff}.side-tools{position:absolute;z-index:6;right:34px;top:46%;display:flex;flex-direction:column;gap:9px}.tool{width:54px;height:54px;display:grid;place-items:center;border:2px solid #b98d50;border-radius:12px;background:#15243aee;color:#eed795;font-size:22px;cursor:pointer}.tool:hover{background:#2e4c66}.action{position:absolute;z-index:6;right:40px;bottom:118px;width:144px;height:105px;border:5px solid #754014;clip-path:polygon(23% 0,77% 0,100% 30%,100% 70%,77% 100%,23% 100%,0 70%,0 30%);background:linear-gradient(135deg,#ffdf68,#e66d1b 47%,#9c3712);box-shadow:0 0 0 4px #f5c86655,0 8px 20px #000b;color:#fff6d7;font-family:inherit;font-size:20px;text-shadow:0 2px 2px #7c1e08;cursor:pointer;transition:.18s}.action:hover{transform:scale(1.06);filter:brightness(1.14)}.action small{display:block;margin-top:4px;font-size:11px;letter-spacing:2px}.hand{position:absolute;z-index:7;bottom:-21px;left:50%;transform:translateX(-50%);height:178px;width:min(780px,63vw);display:flex;justify-content:center;align-items:flex-end}.card{position:relative;width:112px;height:158px;flex:0 0 112px;margin:0 -8px;padding:12px 12px 27px;border:0;border-radius:0;background:#fbf1d8;box-shadow:0 5px 14px #000b;transform:rotate(var(--r)) translateY(var(--y));transition:.2s;cursor:pointer;overflow:visible}.card:after{content:"";position:absolute;z-index:3;inset:-22px -13px -8px;background:url('金榜题名v0.17.4/卡牌样式/小萌卡牌外框.png') center/100% 100% no-repeat;pointer-events:none}.card:hover,.card.selected{z-index:20;transform:rotate(0) translateY(-40px) scale(1.1);box-shadow:0 0 18px #8ad7ff,0 8px 18px #000b}.card .art{position:relative;z-index:1;display:block;height:91px;overflow:hidden;border:1px solid #8f795a;border-radius:3px}.card img{width:100%;height:100%;object-fit:cover}.card b{position:relative;z-index:4;display:block;margin-top:4px;color:#36281e;text-align:center;font-size:12px;white-space:nowrap;text-shadow:0 1px #fff8}.cost{position:absolute;z-index:5;top:0;left:1px;width:29px;height:29px;border-radius:50%;border:2px solid #d8ebff;background:#1764a8;color:#fff;display:grid;place-items:center;font-size:15px}.hint{position:absolute;z-index:6;bottom:16px;left:50%;transform:translateX(-50%);color:#c5d7e8aa;font-size:12px;letter-spacing:3px}.toast{position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);padding:13px 25px;border:1px solid #e5c071;border-radius:8px;background:#101b2be8;box-shadow:0 7px 20px #000;color:#fff1bc;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,-65%)}@media(max-height:760px){.arena{min-height:700px}.play-zone{top:205px;bottom:230px}.play-zone:before{width:220px;height:220px}.player{bottom:94px}.energy{transform:scale(.85);transform-origin:bottom left}.action{transform:scale(.85);transform-origin:bottom right}}
  </style>
</head>
<body>
  <main class="arena">
    <div class="topline"><span class="mark">金榜题名 · 牌局演示</span><span class="turn" id="turnText">第 4 回合 · 你的回合</span><span>📜 对局记录</span></div>
    <section class="portrait enemy"><div class="frame"><img src="金榜题名v0.17.4/立绘/孟头像.png" alt="期末周怪物"></div><span class="health" id="enemyHp">27</span><div class="name">期末周 · 数学</div><div class="power">∑<small>2</small></div></section>
    <div class="school-badge">✦</div>
    <section class="play-zone" aria-label="出牌区">
      <span class="drop-title">出 牌 区</span>
      <span class="drop-note">选择一张手牌后，在这里施展效果</span>
    </section>
    <section class="portrait player"><div class="frame"><img src="金榜题名v0.17.4/立绘/主头像男.png" alt="玩家"></div><span class="health" id="playerHp">24</span><div class="name">你 · 高二上学期</div><div class="power">✎<small>2</small></div></section>
    <div class="energy"><div class="crystals" id="crystals"></div><b class="value" id="energyValue">7/8</b><span class="label">体 力</span></div>
    <nav class="side-tools"><button class="tool" title="查看卡组">▣</button><button class="tool" title="查看弃牌堆">↻</button><button class="tool" title="查看天赋">✦</button></nav>
    <button class="action" id="endTurn">结束回合<small>ENTER</small></button>
    <div class="hint">点击手牌预览 · 选择后可打出</div>
    <section class="hand" id="hand">
      <article class="card" style="--r:-12deg;--y:22px"><span class="cost">2</span><span class="art"><img src="金榜题名v0.17.4/卡牌插画/刷题.png" alt="刷题"></span><b>认真刷题</b></article>
      <article class="card" style="--r:-7deg;--y:8px"><span class="cost">4</span><span class="art"><img src="金榜题名v0.17.4/其他插画/fx_formula.jpg" alt="公式"></span><b>公式推导</b></article>
      <article class="card" style="--r:-2deg;--y:1px"><span class="cost">1</span><span class="art"><img src="金榜题名v0.17.4/其他插画/fx_shuati_2.png" alt="行动"></span><b>深呼吸</b></article>
      <article class="card" style="--r:3deg;--y:2px"><span class="cost">3</span><span class="art"><img src="金榜题名v0.17.4/立绘/小萌Q版.png_副本.png" alt="搭档"></span><b>召唤搭子</b></article>
      <article class="card" style="--r:8deg;--y:10px"><span class="cost">5</span><span class="art"><img src="金榜题名v0.17.4/其他插画/fx_crown.jpg" alt="灵感"></span><b>灵感爆发</b></article>
      <article class="card" style="--r:13deg;--y:24px"><span class="cost">2</span><span class="art"><img src="金榜题名v0.17.4/卡牌插画/卡组.png" alt="计划"></span><b>周末计划</b></article>
    </section>
    <div class="toast" id="toast">已选择卡牌</div>
  </main>
  <script>
    const cards=[...document.querySelectorAll('.card')],toast=document.querySelector('#toast');let selected=null,energy=7,round=4;
    const draw=()=>{document.querySelector('#crystals').innerHTML=Array.from({length:8},(_,i)=>`<i class="crystal ${i<energy?'on':''}"></i>`).join('');document.querySelector('#energyValue').textContent=`${energy}/8`};draw();
    cards.forEach(card=>card.addEventListener('click',()=>{cards.forEach(x=>x.classList.remove('selected'));selected=card;card.classList.add('selected');toast.textContent=`已选择「${card.querySelector('b').textContent}」`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}));
    document.querySelector('#endTurn').addEventListener('click',()=>{if(selected){energy=Math.max(0,energy-Number(selected.querySelector('.cost').textContent));selected.remove();selected=null;toast.textContent='卡牌已打出！';}else{round++;energy=8;toast.textContent='已结束回合，体力恢复。'}draw();document.querySelector('#turnText').textContent=`第 ${round} 回合 · ${selected?'你的回合':'对手思考中'}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)});
  </script>
</body>
</html>
