<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>学生时代牌 — 卡牌Roguelike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0a1628;color:#e0e8f0;overflow:hidden;height:100vh;user-select:none}
/* 全局文字边界：允许中英文和长词换行，由脚本在空间不足时继续缩小。 */
button,.btn,.card,.paper-box,.modal-box,.te-fullscreen,#mapPanel{overflow-wrap:anywhere;word-break:break-word}
[data-autofit="single"]{max-width:100%;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;line-height:1.15}
[data-autofit="block"]{width:100%;max-width:100%;max-height:100%;white-space:normal;overflow:hidden;line-height:1.35}
.card .desc{min-height:0;overflow:hidden!important}.card .desc-content{display:block;width:100%;max-height:100%}
.btn,.te-opt,.sce-option{white-space:normal;min-width:0;max-width:100%;line-height:1.25}
.autofit-min{overflow:auto!important;scrollbar-width:thin}
#app{width:100%;height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative}
#app.menu-full{max-width:100%}
#app.battle-full{max-width:100%;background:linear-gradient(rgba(18,34,53,.52),rgba(31,50,78,.58)),url('其他插画/教室战斗背景.png') center/cover no-repeat;background-color:#1a2a3a}
/* 战斗界面按 16:9 画布排版。超宽/偏窄屏幕留出背景，不再横向或纵向拉散战斗 UI。 */
body:has(#app.battle-full){display:flex;align-items:center;justify-content:center;background:#0a1628}
#app.battle-full{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);margin:0;flex:none}

/* 龙族小说演出：动态壁纸层（内容之下，2026-08-22升级：静态jpg兜底 + 生成视频铺底循环播放） */
.lz-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
  background:url('其他插画/龙族.jpg') center 42%/cover no-repeat, #0a0d12; /* 静态图+深色兜底 */
  opacity:0;filter:blur(12px);transform:scale(1.06);   /* 默认：墨色雾化+轻微放大，供入场晕染 */
  transition:opacity .7s ease, filter 1.1s ease, transform 1.2s ease}
.lz-bg.show{opacity:1;filter:blur(0);transform:scale(1)} /* 水墨渐变入场：雾化墨色逐渐晕开成型 */
/* 动态视频铺满底层 */
.lz-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .8s ease}
/* 暗角压场再叠到视频之上，保证画面氛围统一 */
.lz-bg::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 50% 42%, rgba(12,16,24,.06) 0% 34%, rgba(4,8,14,.42) 62%, rgba(2,4,10,.6) 97%)}
/* 龙族常驻樱花雨（2026-08-22）：整层全屏、不挡操作，单片樱花自顶飘落+左右摆动+自转 */
.lz-petal-fall{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.lz-petal-fall .pf{position:absolute;top:-6vmin;opacity:.95;
  background:radial-gradient(circle at 35% 30%, #fff0f3, #ffd3dc 55%, #f5a9b8);
  border-radius:80% 0 80% 0;
  animation:pf-fall linear forwards}
@keyframes pf-fall{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(var(--sway),26vh) rotate(calc(var(--rot)*0.25))}
  50%{transform:translate(calc(var(--sway)*-0.7),52vh) rotate(calc(var(--rot)*0.55))}
  75%{transform:translate(var(--sway),78vh) rotate(calc(var(--rot)*0.8))}
  100%{transform:translate(0,106vh) rotate(var(--rot))}
}
/* 银河·星尘（2026-08-22）：细小辉光星点自顶缓缓飘落，闪烁、左右摆动 */
.ambient-star{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.ambient-star .ps{position:absolute;top:-2vmin;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.98), rgba(190,228,255,.85) 38%, rgba(180,220,255,.12) 72%);
  box-shadow:0 0 1.4vmin rgba(205,232,255,.95), 0 0 3vmin rgba(180,220,255,.45);
  animation:ps-drift linear forwards}
@keyframes ps-drift{
  0%{transform:translate(0,0) scale(.8);opacity:.1}
  15%{opacity:.95}
  35%{transform:translate(var(--sway),20vh) scale(1.25);opacity:.85}
  55%{transform:translate(calc(var(--sway)*-0.7),42vh) scale(.9);opacity:.95}
  75%{transform:translate(var(--sway),64vh) scale(1.2);opacity:.7}
  100%{transform:translate(0,88vh) scale(.8);opacity:.08}
}
/* 魔戒·圣光屑（2026-08-22）：暖金光点自底缓缓上浮，柔和闪烁（如圣光粒子升腾） */
/* 罗生门·冷雨（2026-08-23 改版）：细长雨丝自顶急落，冷蓝白色调，微斜 */
.ambient-rain{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.ambient-rain .pr{position:absolute;top:-10vh;width:2px !important;height:9vh !important;border-radius:2px;
  background:linear-gradient(to bottom, rgba(170,200,235,0), rgba(185,215,245,.75) 55%, rgba(210,230,250,.95));
  box-shadow:0 0 4px rgba(160,195,235,.5);
  animation:pr-fall linear forwards}
@keyframes pr-fall{
  0%{transform:translate(0,0);opacity:0}
  8%{opacity:.9}
  100%{transform:translate(calc(var(--sway)*1.4),118vh);opacity:.35}
}
.ambient-holy{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.ambient-holy .ph{position:absolute;bottom:-2vmin;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,246,.98), rgba(255,236,180,.9) 34%, rgba(255,220,150,.1) 70%);
  box-shadow:0 0 1.5vmin rgba(255,240,190,.95), 0 0 3.2vmin rgba(255,220,150,.4);
  animation:ph-rise linear forwards}
@keyframes ph-rise{
  0%{transform:translate(0,0) scale(.7);opacity:0}
  12%{opacity:.95}
  34%{transform:translate(var(--sway),-18vh) scale(1.25);opacity:.9}
  54%{transform:translate(calc(var(--sway)*-0.6),-38vh) scale(.95);opacity:.8}
  76%{transform:translate(var(--sway),-58vh) scale(1.15);opacity:.55}
  100%{transform:translate(0,-84vh) scale(.7);opacity:0}
}
/* 内容层提升到壁纸之上：牌局内容/卡牌不被背景遮挡 */
.battle-full #topBar,.battle-full #main,.battle-full #bottomBar{position:relative;z-index:1}
/* 花瓣全屏遮盖特效（源自 花瓣.html，2026-08-22 接入龙族进/退场）：大樱花瓣瞬间铺满→停顿→旋转四散 */
.petal-overlay{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.petal-overlay .st-petal{position:absolute;border-radius:50% 0 50% 0;will-change:transform}
.petal-overlay .st-petal.scatter{animation:stScatter var(--tdur,.8s) cubic-bezier(.25,.46,.45,.94) var(--tdel,0s) forwards}
@keyframes stScatter{
  0%{transform:translate(0,0) rotate(var(--rot0,0deg)) scale(var(--sc0,2.5));opacity:1}
  100%{transform:translate(var(--tx,400px),var(--ty,300px)) rotate(var(--rot1,720deg)) scale(.5);opacity:0}}

/* Top bar */
#topBar{background:#152840;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #0a1220;min-height:52px;flex-shrink:0}
#topBar .title{font-weight:bold;font-size:16px;flex:1}
#topBar .stat{font-size:12px;color:#8ab4f8;background:#0d1f33;padding:4px 10px;border-radius:4px;white-space:nowrap}

/* Main content area */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;scroll-behavior:smooth}
#main::-webkit-scrollbar{width:4px}
#main::-webkit-scrollbar-thumb{background:#2a4a6a;border-radius:2px}

/* Bottom bar */
#bottomBar{background:#152840;padding:8px 16px;border-top:2px solid #0a1220;display:flex;gap:10px;min-height:48px;align-items:center;flex-shrink:0;flex-wrap:wrap;font-size:13px}

/* Cards */
.card{background:#1a3050;border:2px solid #2a4a6a;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all 0.15s;position:relative;min-width:130px;max-width:200px;flex-shrink:0}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,0.4)}
.card:active{transform:scale(0.97)}
.card.logic{border-color:#f05050;background:#2a1520}
.card.idea{border-color:#5090f0;background:#15202a}
.card.answer{border-color:#f0c040;background:#2a2515}
.card.tool{border-color:#40c080;background:#1a2a22}
.card .cost{position:absolute;top:8px;right:10px;background:#0a1628;color:#ffd700;font-weight:bold;font-size:15px;padding:2px 8px;border-radius:12px;min-width:26px;text-align:center}
.card .name{font-weight:bold;font-size:15px;margin-bottom:4px;padding-right:32px}
.card .desc{font-size:12px;color:#b0c8e0;line-height:1.4}
.card .type-badge{font-size:10px;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:4px}
.card .type-badge{display:none!important}
.popup-card-type{margin:-1px 0 6px;color:#9fc3e8;font-size:10px;font-weight:700}
.card.logic .type-badge{background:#f05050;color:#fff}
.card.idea .type-badge{background:#5090f0;color:#fff}
.card.answer .type-badge{background:#f0c040;color:#1a1a00}
.card.tool .type-badge{background:#40c080;color:#06280f}
.card.trap .type-badge{background:#8850b8;color:#fff}
.card.disabled{opacity:0.45;pointer-events:none;filter:grayscale(0.5)}
.card.unplayable{opacity:0.6;border-style:dashed;cursor:not-allowed}
/* 沉睡卡牌梦幻特效（2026-09-09）：整卡梦幻滤镜 + 浮动气泡；苏醒时气泡戳破、滤镜解除 */
.card.card-sleeping{filter:sepia(.22) hue-rotate(230deg) saturate(1.3) brightness(.93);animation:sleep-dream 2.8s ease-in-out infinite}
.card.card-sleeping::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(150,110,255,.3),rgba(110,160,255,.12) 45%,rgba(255,150,240,.2));mix-blend-mode:screen;pointer-events:none}
@keyframes sleep-dream{0%,100%{filter:sepia(.22) hue-rotate(230deg) saturate(1.3) brightness(.93)}50%{filter:sepia(.32) hue-rotate(258deg) saturate(1.55) brightness(1.02)}}
.sleep-bubble{position:absolute;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.8),rgba(190,150,255,.22) 55%,rgba(150,110,255,.15) 78%);border:1px solid rgba(205,180,255,.6);box-shadow:0 0 6px rgba(170,130,255,.35);animation:sleep-float var(--sb-dur,3.4s) ease-in-out infinite}
@keyframes sleep-float{0%,100%{transform:translateY(2px) translateX(0);opacity:.7}50%{transform:translateY(-10px) translateX(4px);opacity:1}}
.sleep-badge{position:absolute;top:6px;left:8px;font-size:11px;color:#cdb8ff;text-shadow:0 0 6px rgba(150,110,255,.9);pointer-events:none;z-index:2}
/* 苏醒戳破：fxLayer 上的瞬时气泡爆裂（2026-09-09） */
.fx-bubble-pop{position:absolute;border-radius:50%;pointer-events:none;border:2px solid rgba(200,170,255,.95);background:radial-gradient(circle at 35% 32%,rgba(235,220,255,.9),rgba(170,130,255,.3) 55%,rgba(140,100,255,.12) 78%);box-shadow:0 0 10px rgba(180,140,255,.6);animation:sleep-pop .5s ease-out forwards}
@keyframes sleep-pop{0%{transform:scale(.3);opacity:1}45%{transform:scale(1.15);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.card-hover-popup{display:none}.card-hover-popup>b{display:block;color:#ffd878;font-size:13px;margin-bottom:5px}.popup-keyword{margin-top:6px;padding-top:5px;border-top:1px solid #ffffff18}.popup-keyword em{color:#ffd05f;font-style:normal;margin-right:5px}.kw-tip{color:#ffd36a;font-weight:700}.card-global-tip{position:fixed;z-index:99999;display:none;pointer-events:none;max-width:280px;padding:12px 14px;border-radius:9px;border:1px solid #d5aa57;background:rgba(8,19,34,.97);color:#dcecff;font-size:11px;line-height:1.55;white-space:normal;box-shadow:0 8px 24px #000b}.card-global-tip>b{display:block;color:#ffd878;font-size:13px;margin-bottom:5px}

/* Buttons */
.btn{background:#1e4080;color:#fff;border:2px solid #3060c0;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:bold;transition:all 0.15s;white-space:nowrap}
.btn:hover{background:#2550a0;border-color:#4080e0}
.btn:active{transform:scale(0.95)}
.btn.primary{background:#c04020;border-color:#e05030}
.btn.primary:hover{background:#d05030}
.btn.success{background:#208040;border-color:#30a050}
.btn.small{padding:6px 12px;font-size:12px}
.btn.danger{background:#802020;border-color:#a03030}

/* Modal overlay */
#modalOverlay{position:fixed;inset:0;background:rgba(5,10,20,0.75);display:flex;align-items:center;justify-content:center;z-index:100}
#modalOverlay.over-event{z-index:140}
.modal-box{background:#152840;border:2px solid #3060c0;border-radius:12px;padding:16px;width:min(420px,90vw);max-height:80vh;overflow-y:auto}
.modal-box.modal-te{background:transparent;border:none;padding:0;width:min(660px,94vw);max-height:88vh;overflow-y:auto}
.card.selected{border-color:#ffd700!important;box-shadow:0 0 10px rgba(255,215,0,0.5);transform:translateY(-2px)}
.btn.warn{background:#806020;border-color:#a08030}

/* Map */
/* 地图节点=插画本身当按钮（用户定 2026-08-17）：无框无底，状态用光晕/透明度表达 */
.map-node{width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;border:none;background:transparent;cursor:pointer;transition:all 0.2s;position:relative;flex-shrink:0}
.map-node.reachable{animation:pulseArt 1.5s infinite}
.map-node.done{opacity:0.65}
.map-node.locked{opacity:0.4;pointer-events:none}
.map-node.pv-avail.locked{pointer-events:auto;cursor:help}
.map-node.pv-avail{cursor:help}
.map-node.boss{width:88px;height:88px;font-size:38px}
.map-node.current{filter:drop-shadow(0 0 14px rgba(255,215,0,.95))}
@keyframes pulseArt{0%,100%{filter:drop-shadow(0 0 8px rgba(64,224,96,.55))}50%{filter:drop-shadow(0 0 22px rgba(64,224,96,1))}}

.map-label{font-size:8px;color:#a0b8d0;text-align:center;position:absolute;bottom:-16px;white-space:nowrap;width:60px;left:50%;transform:translateX(-50%)}
/* 节点插画（用户提供：战斗/事件/搭档节点；可前往=绿版，当前=黄版，其余=原色） */
.map-node-art{width:92%;height:92%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.map-node.current{opacity:1}
/* 地图：从左往右排列（用户定 2026-08-16）：推进步=横向列，分支上下堆叠，连接线横向 */
.map-row{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px;min-width:56px;justify-content:center}
.map-connector{width:16px;height:2px;background:#2a4a6a;margin:auto 0;flex-shrink:0}
.map-branch{display:flex;flex-direction:column;gap:8px;justify-content:center;padding:0 4px}
.map-branch-col{display:flex;flex-direction:column;align-items:center;gap:0}
.map-hwrap{display:flex;flex-direction:row;align-items:center;gap:0;margin:auto}
/* 地图整体居中（用户定 2026-08-16）：主区域纵向flex，节点条在剩余空间双轴居中 */
#main.map-mode{display:flex;flex-direction:column;position:relative}
.map-scroll{display:flex;flex:0 0 190px;min-height:180px;overflow-x:auto;align-items:center;padding:8px 0}
/* 节点弹窗右侧大屏（2026-08-21）：地图右侧固定信息面板，点击节点显示，点空白关闭 */
#mapPanel{position:relative;left:auto;right:auto;top:auto;bottom:auto;box-sizing:border-box;flex:0 0 auto;align-self:center;width:min(1560px,98%);height:clamp(315px,48vh,495px);margin:0 auto 4px;background:#fbf1d8;border:4px solid #c9ad75;border-radius:18px;padding:18px 24px 18px 190px;overflow-y:auto;z-index:20;display:block;visibility:hidden;opacity:0;box-shadow:0 10px 28px rgba(70,45,18,.28);color:#4a3822;transition:opacity .14s ease}
#mapPanel.open{visibility:visible;opacity:1}
.bundle-product{grid-column:span 2}.bundle-row{display:flex;align-items:center;justify-content:center;gap:10px}.bundle-half{min-width:0;flex:1}.bundle-plus{font-size:34px;font-weight:bold;color:#9b6c25}
#mapPanel .mp-title{font-size:15px;font-weight:bold;color:#ffd700;text-align:center;margin-bottom:8px;letter-spacing:1px}
#mapPanel .mp-row{font-size:12px;color:#a0b8d0;margin:4px 0;line-height:1.5}
#mapPanel .mp-cards{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px;margin-top:10px;padding:8px 4px 18px}
#mapPanel .mp-status{text-align:center;font-size:12px;margin:10px 0;font-weight:bold}
#mapPanel .mp-hint{color:#6a8aaa;font-size:12px;text-align:center;margin-top:30%;line-height:1.8}
#mapPanel .mp-go-wrap{position:fixed;left:var(--map-go-left,24px);top:var(--map-go-top,50%);width:142px;transform:translateY(-50%);display:flex;justify-content:center;pointer-events:none;z-index:24}#mapPanel .mp-go{width:126px;height:52px;pointer-events:auto;border:3px solid #9b6c25!important;border-radius:5px!important;outline:3px solid #d2b06d;outline-offset:5px;box-shadow:inset 0 0 0 2px #f7e8bd,0 5px 12px rgba(73,47,13,.3);letter-spacing:4px}#mapPanel .map-preview-card{width:120px;height:185px;flex:0 0 120px}.map-scroll{flex:0 0 190px;min-height:180px}
/* 天赋大屏事件框（2026-08-21）：大屏专属角色事件框 */
/* 全屏天赋事件/选天赋（2026-08-21）：先全屏剧情对话，再全屏三选页 */
.te-fullscreen{position:fixed;inset:0;z-index:120;background:linear-gradient(180deg,#f6f9fd 0%,#e6eefb 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.te-fullscreen:after{content:'';position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,#AECBEB 0 18px,#ffffff 18px 26px)}
.te-fullscreen .te-holes{position:absolute;left:16px;bottom:20px;display:flex;gap:6px;z-index:1}
.te-fullscreen .te-holes i{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #AECBEB}
.te-fullscreen .te-top{font-size:16px;color:#3d6fa8;font-weight:bold;margin:22px 0 4px;text-align:center;letter-spacing:3px}
.te-fullscreen .te-name{font-size:22px;color:#c04020;font-weight:bold;text-align:center;margin-bottom:18px;letter-spacing:4px}
.te-fullscreen .te-narr{width:min(700px,86vw);background:#eef4fb;border:1px solid #d5e7f7;border-radius:12px;padding:22px 180px 22px 26px;font-size:17px;color:#24466b;line-height:2.1;min-height:150px;white-space:pre-wrap;flex:1;box-sizing:border-box}
/* 事件奖励条（2026-09-09）：选项结算后在剧情文本下方展示获得的奖励 */
.te-reward{display:flex;align-items:center;gap:8px;margin:12px auto 0;width:fit-content;padding:8px 20px;border:1px solid rgba(255,180,60,.65);border-radius:999px;background:linear-gradient(90deg,rgba(255,200,80,.18),rgba(255,150,60,.1));color:#8a4a10;font-size:15px;font-weight:bold;text-shadow:0 1px 0 rgba(255,255,255,.5);animation:rewardPop .45s ease-out}
@keyframes rewardPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.te-fullscreen #te-opts{width:min(700px,86vw);margin-top:12px}
.te-fullscreen .te-opt{display:block;width:100%;text-align:left;background:#fff7f7;border:2px solid #ffd2d2;color:#FF6B6B;border-radius:10px;padding:14px 16px;font-size:16px;cursor:pointer;margin-top:12px;font-family:inherit}
.te-fullscreen .te-opt:disabled{opacity:.55;cursor:default}
.te-fullscreen .te-cursor{display:inline-block;width:2px;height:16px;background:#ff9d5c;vertical-align:-2px;animation:tsBlink .8s steps(2) infinite}
.te-fullscreen .te-ava{position:absolute;right:16px;bottom:22px;height:46vh;max-height:340px;object-fit:contain;pointer-events:none;z-index:1}
.te-fullscreen .te-pick{width:min(700px,86vw);display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center;padding-bottom:24px}

@keyframes tsBlink{50%{opacity:0}}

/* Battle arena */
#handArea{display:flex;gap:8px;overflow-x:auto;padding:8px 0;flex-wrap:nowrap;min-height:100px;align-items:flex-start}
#handArea::-webkit-scrollbar{height:3px}
#handArea::-webkit-scrollbar-thumb{background:#2a4a6a}
/* 出牌区无边框（用户定 2026-08-16）：直接铺在牌局背景上 */
#playerZone{text-align:center;padding:8px;background:#152028;border-radius:8px;margin-bottom:8px;border:2px solid #204060}

/* ===== 战斗布局 v2：中心出牌区 + 底部面板 ===== */
#main.battle-mode{overflow:hidden;padding:0;display:flex;flex-direction:column}
#battleStage{flex:1;display:flex;flex-direction:row;overflow:hidden;padding:10px 12px 4px;min-height:0;gap:6px;position:relative}
/* 战斗对半分割（用户定 2026-08-16）：上半=怪物 下半=玩家，各有出牌区+手牌区，紧贴无间隙 */
.stage-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;gap:0}
.half{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* 半场无背景框（只要牌局背景图，用户定 2026-08-16）；中心虚线已移除，改放：玩家生命上方+怪物手牌下方（用户定 2026-08-18） */
.monster-half{background:transparent}
.player-half{background:transparent}
/* 怪物半场=行布局（左右对调+主列与玩家一致，用户定 2026-08-18）：主列[属性行→手牌行(手牌在生命下方)] ｜ 右列[立绘、名字+手牌数] */
.monster-half{flex-direction:row;overflow:visible}
.monster-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:visible;padding:4px 8px 0 10px}
.monster-side{width:140px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;min-height:0;padding:4px 0 0;border-left:1.5px dashed rgba(220,235,255,.3)}
/* 怪物右列（对应玩家左列旋转180°）：生命水晶在上（圆形，LoR 风格 2026-08-21），名字+手牌数在下 */
#monsterPortraitBox{border:none;position:relative;background:transparent;overflow:visible}
#monsterInfo{flex-shrink:0;text-align:center;padding:0 2px}

/* 怪物手牌行（主列顶部，与玩家手牌行绕中心对称）；怪物属性行（中部，与玩家生命体力行对称） */
/* 怪物手牌=与玩家等大的竖版卡（用户定 2026-08-18）：4张150px卡放不下时横向滚动，不换行 */
#monsterHandRow{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 8px 8px;flex-wrap:nowrap;overflow-x:auto;min-height:185px;border-bottom:1.5px dashed rgba(220,235,255,.3)} /* 手牌下方虚线（与玩家生命上方虚线绕中心对称） */
#monsterHandRow .mhand-big{flex-shrink:0;width:120px;height:185px;cursor:help;transform:none}
#monsterHandRow .mhand-big .q-orb-wrap{display:none} /* 怪物卡无品质概念 */
/* 怪物卡背（任务1：手牌背面朝玩家，只露数量）；卡牌样式/怪物卡背.png 为待出图资源，缺失时回退渐变 */
.card.card-back{
  background-image:url('卡牌样式/怪物卡背.png'),linear-gradient(160deg,#3a2a5a 0%,#1e1430 100%);
  background-size:cover,cover;background-position:center;
  border:2px solid rgba(180,140,255,.55);border-radius:8px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.45);
  position:relative;overflow:hidden;cursor:help;
}
.card.card-back::after{
  content:'👾';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:54px;opacity:.82;text-shadow:0 0 14px rgba(180,140,255,.7);pointer-events:none;
}
.monster-piles{display:flex;gap:6px;margin-top:6px;justify-content:center}
.monster-pile{width:52px;height:75px;flex:none;align-self:flex-start} /* 怪物牌堆比玩家手牌牌堆小，避免挤压立绘 */
/* 玩家半场=行布局：左立绘列（技能在上+立绘撑满到底，底与卡牌底持平）+ 右主列（BUFF→生命→手牌） */
.player-half{flex-direction:row;overflow:visible}
.player-side{position:relative;width:140px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;min-height:0;padding:4px 0 0;border-right:1.5px dashed rgba(220,235,255,.3)}
/* 双方生命球放在角色右侧的战斗留白中，避免压住左侧角色立绘。 */
#dualNexusStack{position:absolute;z-index:12;left:calc(100% + 92px);top:calc(-100% + 205px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 0 10px;overflow:visible;pointer-events:auto}
#dualNexusStack #monsterPortraitBox,#dualNexusStack #portraitBox{display:flex;align-items:center;justify-content:center;overflow:visible}
#dualNexusStack .nexus{width:100px;height:100px}
#dualNexusStack .nexus-tab{left:calc(100% + 18px)}
/* 玩家主列内容贴底（用户定 2026-08-18）：BUFF/生命/手牌全部下降，手牌底与立绘底持平（立绘 flex:1 撑满到底） */
.player-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:visible;padding:4px 10px 0 8px}
/* 左侧出牌记录 */
#logRail{position:relative;z-index:102;width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
#logToggle{width:100%;background:rgba(21,40,64,.6);border:none;border-radius:8px;color:#8ab4f8;font-size:10px;cursor:pointer;padding:8px 0;line-height:1.6;transition:all .15s}
#logToggle:hover{border-color:#ffd700;color:#ffd700}
#logToggle.on{background:#1a2a44;border-color:#ffd700;color:#ffd700}
#battleTalentToggle{width:36px;min-height:44px;border:1px solid #b58bff;border-radius:7px;background:#17213a;color:#e3d5ff;font-size:10px;line-height:1.3;cursor:pointer;padding:3px 0}
#battleTalentToggle:hover{background:#6d48a8;color:#fff;box-shadow:0 0 10px rgba(181,139,255,.8)}
/* 记录面板：米黄底+绝对定位不挤动战斗区+底部与怪物手牌底部持平（用户定 2026-08-18）；left=padding12+logRail36+gap6=54px；高度=怪物手牌底286-面板顶10=276px（实测 2026-08-18：手牌行257=卡240+padding16+边框1.5，顶29；absolute 使战斗区不再被挤窄换行） */
#playLogPanel{position:absolute;left:54px;top:10px;width:0;overflow:hidden;display:flex;flex-direction:column;transition:width .25s ease;background:#e3d2ae;border:1.5px dashed rgba(140,105,50,.45);border-radius:8px;z-index:101}
#playLogPanel.open{width:230px;height:138px}
#playLogHeader{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#5a4630;padding:6px 8px 4px;white-space:nowrap;flex-shrink:0;min-width:200px}
.pl-close{cursor:pointer;color:#8a6a3a;font-size:12px}
.pl-close:hover{color:#5a4630}
#playLogList{flex:1;overflow-y:auto;min-width:200px;padding:0 8px 8px}
#playLogList::-webkit-scrollbar{width:3px}
#playLogList::-webkit-scrollbar-thumb{background:#c8b08a}
.log-record{font-size:11px;color:#5a4630;padding:3px 0;border-bottom:1px dashed rgba(140,105,50,.45);position:relative;white-space:normal;overflow:visible;line-height:1.45;overflow-wrap:anywhere}
.log-record.p{color:#2a5a8a}
.log-record.m{color:#a03030}
.log-card-name{position:relative;color:#7b3fb6;font-weight:bold;text-decoration:underline dotted;cursor:help}
.log-card-name:hover::after{content:attr(data-tip);position:fixed;left:58px;top:80px;width:260px;max-height:220px;overflow:auto;padding:8px 10px;border-radius:7px;background:#0b1728;color:#f5e8b8;border:1px solid #d8ae55;box-shadow:0 5px 20px rgba(0,0,0,.55);white-space:normal;z-index:9999;font-weight:normal;text-decoration:none;pointer-events:none}
.battle-talent-title{margin:9px 0 5px;color:#8ab4f8;font-size:12px}.battle-talent-title.enemy{color:#ff9a9a}.battle-talent-row{display:flex;flex-direction:column;gap:3px;background:#182a3c;border:1px solid #31506d;border-radius:7px;padding:7px 9px;margin-bottom:5px;font-size:11px}.battle-talent-row b{color:#ffd700}.battle-talent-row span{color:#b9cadd;line-height:1.45}.battle-talent-row.enemy{border-color:#743d46}.battle-talent-row.enemy b{color:#ff9a9a}.battle-talent-empty{font-size:10px;color:#71869c;padding:5px 0}
.log-record-empty{font-size:10px;color:#8a6a3a;padding:4px 0}
.stage-title{font-size:10px;color:#4a6a8a;text-align:center;letter-spacing:3px;flex-shrink:0;margin-top:6px}
/* 战斗日志：左上角浮层（用户定 2026-08-16） */
/* 左上角战斗日志浮层已移除（2026-08-18 用户：怪物生命上边的黑框） */
#battlePanel{flex-shrink:0;background:#101d30;border-top:2px solid #204060;display:flex;gap:8px;padding:8px;justify-content:center}
.bp-left{display:flex;flex-direction:column;width:150px;flex-shrink:0;gap:6px}
/* 卡组/弃牌堆：插画铺满+底部标签（用户提供 卡牌插画/卡组.png、卡牌插画/弃牌堆.png，2026-08-16 导入） */
.pile-zone{background:linear-gradient(180deg,#e3d2ae 0%,#f8f1e0 100%);border:2px solid rgba(140,105,50,.45);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:help;position:relative;transition:border-color 0.15s;overflow:hidden}
.pile-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pile-zone .pile-label{position:absolute;bottom:0;left:0;right:0;text-align:center;background:rgba(13,25,42,.78);color:#ffd700;font-size:12px;font-weight:bold;padding:4px 0;margin:0;z-index:2}
.pile-zone:hover{border-color:#c8963c}
.pile-zone::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#3a2a14;color:#f8ead0;padding:5px 10px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:60;border:1px solid #c8963c;pointer-events:none;display:none}
.pile-zone:hover::after{display:block}
/* 卡组/弃牌堆与手牌同尺寸（用户定 2026-08-16） */
#discardZone{width:120px;height:185px;flex:none}
#deckZone{width:120px;height:185px;flex-shrink:0;align-self:center}
#attrCol{flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center}
.attr-line{background:#0d1f33;border:1px solid #1a3050;border-radius:6px;padding:4px 6px;font-size:11px;color:#a0b8d0;display:flex;justify-content:space-between;gap:4px;cursor:help;transition:border-color 0.15s}
.attr-line b{color:#e0e8f0}
.attr-line:hover{border-color:#ffd700;color:#ffd700}
#portraitWrap{width:132px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
#portraitBox{border:none;position:relative;background:transparent;overflow:visible;flex:0 0 auto} /* 2026-08-21：圆形生命水晶容器（.nexus），在 .player-mid 内居中，overflow 可见以露出右侧标签 */
.portrait-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.portrait-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.portrait-ph::before{content:'';position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,215,0,0.14),transparent);animation:portraitShine 3.2s infinite}
@keyframes portraitShine{0%{left:-80%}55%,100%{left:130%}}
.portrait-emoji{font-size:42px;animation:portraitFloat 2.6s ease-in-out infinite}
@keyframes portraitFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.portrait-name{font-size:12px;font-weight:bold;color:#ffd700}
.portrait-hint{font-size:9px;color:#4a6a8a}
#skillRow{display:flex;flex-direction:column;gap:4px}
#skillRow .skill-tooltip{display:block;width:100%;cursor:help}
#skillRow .btn{font-size:10px;padding:5px 6px;width:100%;overflow:hidden;text-overflow:clip}
.bp-right{flex:1;display:flex;gap:6px;min-width:0}
.bp-right-inner{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#statusRow{display:flex;flex-wrap:wrap;gap:3px;align-items:center;align-content:flex-start;font-size:10px;color:#a0b8d0;min-height:22px;max-height:70px;overflow-y:auto;flex-shrink:0}
#statusRow::-webkit-scrollbar{width:3px}
#statusRow::-webkit-scrollbar-thumb{background:#2a4a6a}
.zone-label{font-size:9px;color:#4a6a8a;letter-spacing:1px;margin-right:2px}
.util-badge{font-size:10px;background:rgba(26,42,68,.7);border:none;border-radius:8px;padding:2px 6px;cursor:help;white-space:nowrap;position:relative}
.util-badge.tool-badge{border-color:#40c080;color:#80e0b0}
.util-badge:hover{border-color:#ffd700}
.util-badge::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0a1628;color:#ffd700;padding:5px 10px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:60;border:1px solid #ffd700;pointer-events:none;display:none}
.util-badge:hover::after{display:none}
#vitalRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex-shrink:0;border-top:1.5px dashed rgba(220,235,255,.3);padding-top:8px;margin-top:8px} /* 生命上方虚线（与怪物手牌下方虚线绕中心对称，用户定 2026-08-18） */
.vital-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#a0b8d0;flex:1;min-width:150px}
.vital-item .vital-label{white-space:nowrap}
.energy-dot{width:12px;height:12px}
/* 手牌行在玩家主列内（2026-08-21 用户需求：手牌区做小，出牌区做大） */
#handRow{flex:none;display:flex;min-height:250px;padding-left:0}
/* 手牌区给外框留空间（用户定 2026-08-18）：内边距=外框超出量，避免 overflow 裁掉外框 */
#handArea{flex:1;display:flex;gap:0;overflow-x:auto;overflow-y:hidden;padding:66px 12px 10px 12px;align-items:flex-end;justify-content:center;min-width:0;scrollbar-width:none}
#handArea .hand-card + .hand-card{margin-left:-24px} /* 扇形重叠（LoR 手牌堆叠感，2026-08-23） */

/* ===== 生命水晶（LoR 风格，2026-08-21 用户需求）：圆形水晶放左右列中线对称（略小 84px），立绘移出水晶、在球下作半身立绘；扣血时残影环流动追落 ===== */
.nexus{position:relative;width:84px;height:84px;border-radius:50%;flex:0 0 auto}
.nexus .nexus-art{position:absolute;z-index:1;inset:2px;border-radius:50%;overflow:hidden;background:#07101d;box-shadow:inset 0 0 18px rgba(0,0,0,.9),0 0 8px rgba(255,255,255,.14)}
.nexus .nexus-fill{position:absolute;left:0;right:0;bottom:0;height:100%;transition:height .72s cubic-bezier(.2,.72,.24,1);box-shadow:inset 0 7px 13px rgba(255,255,255,.18),inset 0 -10px 18px rgba(0,0,0,.28);will-change:height}
.nexus .nexus-fill:before{content:'';position:absolute;z-index:2;left:-18%;right:-18%;top:-7px;height:15px;border-radius:48%;background:rgba(255,255,255,.68);box-shadow:0 4px 9px rgba(255,255,255,.2);opacity:.88;animation:nexusLiquidWave 1.35s ease-in-out infinite alternate}
.nexus .nexus-fill:after{content:'';position:absolute;z-index:1;inset:8px 5px 4px;background:radial-gradient(circle at 22% 82%,rgba(255,255,255,.38) 0 2px,transparent 3px),radial-gradient(circle at 70% 66%,rgba(255,255,255,.3) 0 3px,transparent 4px),radial-gradient(circle at 47% 91%,rgba(255,255,255,.24) 0 1.5px,transparent 2.5px);background-repeat:no-repeat;animation:nexusLiquidBubbles 2.1s linear infinite}
.nexus-player .nexus-fill{background:linear-gradient(180deg,#69e7ff 0%,#1597cf 45%,#07517f 100%)}
.nexus-monster .nexus-fill{background:linear-gradient(180deg,#ff8b86 0%,#e83f4f 45%,#8a142b 100%)}
.nexus .nexus-art:after{content:'';position:absolute;z-index:2;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.48),transparent 43%),linear-gradient(90deg,rgba(255,255,255,.08),transparent 35%,rgba(0,0,0,.16));pointer-events:none} /* 球面高光 */
.nexus .nexus-tab{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);background:rgba(13,25,42,.88);border:1.5px solid #39c5e8;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:bold;color:#cdeeff;white-space:nowrap;z-index:5;line-height:1.35;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.nexus-monster .nexus-tab{border-color:#ff5a5a;color:#ffd9d9}
.nexus .nexus-shield{position:absolute;top:-5px;right:-5px;background:#12365e;border:1.5px solid #6ab0ff;border-radius:10px;padding:2px 6px;font-size:11px;font-weight:bold;color:#cfe8ff;z-index:6;box-shadow:0 0 8px rgba(106,176,255,.45)}
.nexus .nexus-shield,.et-energy{cursor:help}
.monster-statuses{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:30px}
@keyframes nexusLiquidWave{0%{transform:translateX(-4%) rotate(-2deg) scaleY(.72)}100%{transform:translateX(4%) rotate(2deg) scaleY(1.08)}}
@keyframes nexusLiquidBubbles{0%{transform:translateY(12px);opacity:.25}35%{opacity:.75}100%{transform:translateY(-24px);opacity:0}}
.nexus-player{animation:nexusGlowP 3.2s ease-in-out infinite}
@keyframes nexusGlowP{0%,100%{box-shadow:0 0 14px rgba(57,197,232,.22)}50%{box-shadow:0 0 26px rgba(57,197,232,.5)}}
.nexus-monster{animation:nexusGlowM 3.2s ease-in-out infinite}
@keyframes nexusGlowM{0%,100%{box-shadow:0 0 14px rgba(255,90,90,.2)}50%{box-shadow:0 0 26px rgba(255,90,90,.45)}}
.player-side .nexus,.monster-side .nexus{margin:0 auto} /* 双方水晶在各自 mid 容器内垂直居中，左右镜像对称 */
/* 半身立绘（2026-08-21 用户需求）：生命水晶正下方，取景头+胸（半身），不放进球内 */
.player-mid,.monster-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.player-mid::before,.monster-mid::before{display:none}
#portraitBox,#monsterPortraitBox{border:none;position:relative;background:transparent;overflow:visible;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.nexus-portrait{position:relative;width:100%;flex:1;min-height:120px;overflow:visible;border-radius:0;display:flex;align-items:flex-start;justify-content:center;isolation:isolate}
.nexus-portrait .portrait-art{position:absolute;z-index:2;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0;transform:none;transform-origin:50% 0;display:block} /* 普通完整立绘：顶部对齐，不裁切 */
.nexus-portrait .portrait-art.portrait-huxiaomeng-ex{inset:0 auto 0 50%;width:auto;max-width:none;height:100%;transform:translateX(-50%);transform-origin:50% 50%;object-fit:contain} /* 按高度铺满，裁掉两侧多余透明留白 */
.nexus-portrait .portrait-ph{width:100%;height:100%}
.nexus-portrait .portrait-emoji{font-size:52px;animation:portraitFloat 2.6s ease-in-out infinite}
.nexus-portrait .portrait-name{font-size:12px;font-weight:bold;color:#ffd700}
.nexus-portrait .portrait-hint{font-size:9px;color:#4a6a8a}
.nexus-portrait.monster{align-items:center}
.nexus-portrait.monster .portrait-emoji{font-size:56px;text-shadow:0 0 18px rgba(200,120,255,.5)}

/* ===== 结束回合区双体力面板（LoR 风格，2026-08-21 用户需求）：按钮上方=玩家体力，下方=怪物体力，显示当前/上限 ===== */
.stage-right{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 6px 4px}
.et-energy{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(13,25,42,.72);border:1.5px solid rgba(245,215,110,.32);border-radius:10px;padding:6px 7px;min-width:66px}
.et-e-label{font-size:10px;color:#8a9ab0;letter-spacing:2px;white-space:nowrap}
.et-e-gems{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:78px}
.et-e-num{font-size:13px;font-weight:bold;color:#f5d76e;line-height:1}
.et-energy .energy-dot{width:11px;height:11px}

/* ===== 竖版大手牌卡面 =====
   结构：顶部=名字(中)+类别(右上)+费用(左上)，中部=插画区，插画下=品质球，底部=效果 */
/* 手牌扇形（LoR 风格，2026-08-23）：每张卡由渲染时内联设置 --fan-rot/--fan-y，transform 读变量成弧形排列；
   悬停转正上浮放大（!important 覆盖变量 transform），z-index 提升盖过邻牌 */
.hand-card{width:120px;height:185px;min-width:0;max-width:none;padding:0;display:flex;flex-direction:column;border-radius:10px;position:relative;
  transform:rotate(var(--fan-rot,0deg)) translateY(var(--fan-y,0px));transform-origin:50% 100%;
  transition:transform .22s cubic-bezier(.2,.75,.3,1.12),box-shadow .18s ease}
.hand-card:hover{transform:rotate(0deg) translateY(-12px) !important;z-index:60;box-shadow:0 16px 32px rgba(0,0,0,.55),0 0 20px rgba(130,190,255,.28)}
.hand-card .cost{position:absolute;top:6px;right:6px;left:auto;font-size:14px;padding:1px 8px;z-index:8}
.hand-card .name{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:14px;margin:0;padding:0 40px;white-space:nowrap;overflow:hidden;text-overflow:clip;z-index:2}
.hand-card .type-badge{position:absolute;top:8px;left:6px;right:auto;margin:0;font-size:10px;padding:1px 6px;z-index:3}
.card-item-stack{position:absolute;z-index:9;right:6px;top:38px;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:visible;pointer-events:auto}
.card-item-orb{display:flex;align-items:center;justify-content:center;width:27px;height:27px;min-width:27px;padding:0;border-radius:50%;border:2px solid #132238;background:#31465e;color:#fff;font-size:15px;line-height:1;box-shadow:0 2px 6px #0009;cursor:help;overflow:hidden}
.card-item-orb.q-green{border-color:#5ed47d;background:radial-gradient(circle at 35% 30%,#73a985,#1c5230)}
.card-item-orb.q-blue{border-color:#69b8ff;background:radial-gradient(circle at 35% 30%,#6a9dcc,#244d83)}
.card-item-orb img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.card-item-global-tip{z-index:100005;max-width:300px}
.shop-product-grid{display:grid;grid-template-columns:repeat(4,minmax(128px,1fr));gap:8px;max-height:68vh;overflow:auto;padding:2px}
.shop-product{position:relative;min-width:0;padding:7px;border:1.5px solid #567;border-radius:9px;background:rgba(5,15,28,.78);display:flex;flex-direction:column;align-items:center;gap:5px}
.shop-product-card{height:142px;display:flex;align-items:flex-start;justify-content:center}
.shop-product .shop-mini-card{transform:scale(.72);transform-origin:50% 0;margin-bottom:-52px}
.shop-product .shop-mini-card:hover{transform:scale(.72) translateY(-5px)!important}
.shop-product-item{width:100%;display:flex;align-items:center;gap:5px;border:1px solid;border-radius:6px;padding:4px;font-size:15px}
.shop-product-item div{min-width:0}.shop-product-item b{display:block;color:#fff;font-size:10px}.shop-product-item small{display:block;color:#9eb4ca;font-size:8px;line-height:1.25}
.shop-product-quality{width:100%;display:flex;justify-content:space-between;font-size:8px}.shop-product>.btn{width:100%;padding:4px;font-size:10px}.shop-product>.btn del{color:#899;font-size:8px}.shop-product>.btn i{color:#f88;font-size:8px;font-style:normal}
.shop-discount{position:absolute;z-index:20;top:3px;left:3px;padding:2px 5px;border-radius:5px;background:#d84b35;color:#fff3a0;font-size:8px;font-weight:bold}
.flaw-ring{position:absolute;z-index:4;inset:0;pointer-events:none}.flaw-ring-svg{position:absolute;left:-22px;top:-22px;width:144px;height:144px;overflow:visible;filter:drop-shadow(0 0 8px rgba(255,255,255,.3))}.flaw-arc{fill:none;stroke-width:11;stroke-linecap:round;stroke-dasharray:72 242;animation:flawArcIn .22s ease-out}.flaw-arc-logic{stroke:#e34f61}.flaw-arc-idea{stroke:#4b9ee8}.flaw-arc-answer{stroke:#e4b63f}.flaw-arc-tool{stroke:#55bd78}.flaw-ring-label{position:absolute;z-index:7;display:flex;align-items:center;justify-content:center;min-width:30px;height:18px;padding:0 5px;border:1px solid #fff9;border-radius:9px;color:#fff;font-size:9px;font-weight:900;line-height:1;white-space:nowrap;pointer-events:auto;cursor:help;box-shadow:0 2px 6px #0009}.flaw-ring-label::after{content:attr(data-tip);position:absolute;z-index:90;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);display:none;width:max-content;max-width:260px;padding:5px 8px;border:1px solid #ffd776;border-radius:6px;background:#0a1628;color:#ffe6a6;font-size:9px;font-weight:normal;line-height:1.45;white-space:normal;box-shadow:0 5px 14px #000a;pointer-events:none}.flaw-ring-label:hover::after{display:block}.flaw-label-logic{left:3px;top:-30px;background:#a93645}.flaw-label-idea{right:-25px;top:-30px;background:#316fa5}.flaw-label-answer{right:-25px;bottom:-30px;background:#a47b24}.flaw-label-tool{left:3px;bottom:-30px;background:#398052}@keyframes flawArcIn{from{opacity:0;stroke-width:3}to{opacity:1;stroke-width:11}}
.hand-card .card-art{flex:2;display:flex;align-items:center;justify-content:center;font-size:58px;border-radius:8px 8px 0 0;position:relative;overflow:hidden;z-index:1}
.hand-card .card-art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,rgba(255,255,255,0.12),transparent 62%);pointer-events:none}
.hand-card .card-art img.card-art-img{width:100%;height:100%;object-fit:cover}
.hand-card.logic .card-art{background:linear-gradient(160deg,#3a1a24,#1a2a44)}
.hand-card.idea .card-art{background:linear-gradient(160deg,#152c44,#15243a)}
.hand-card.answer .card-art{background:linear-gradient(160deg,#3a3014,#1a2a44)}
.hand-card.tool .card-art{background:linear-gradient(160deg,#14301e,#1a2a44)}
.hand-card .q-orb-wrap{height:0;display:flex;justify-content:center;position:relative;z-index:2}
.q-orb{width:26px;height:26px;border-radius:50%;margin-top:-26px;border:2px solid #0a1628;cursor:help;position:relative}
.q-orb::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0a1628;color:#ffd700;padding:4px 9px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:80;border:1px solid #ffd700;pointer-events:none;display:none}
.q-orb:hover::after{display:block}
.q-orb.q-green{background:radial-gradient(circle at 35% 30%,#a0f0b0,#208040);box-shadow:0 0 8px rgba(80,220,120,0.55)}
.q-orb.q-white{background:radial-gradient(circle at 35% 30%,#ffffff,#8a98a8);box-shadow:0 0 8px rgba(220,230,240,0.45)}
.q-orb.q-blue{background:radial-gradient(circle at 35% 30%,#a0d0ff,#3060c0);box-shadow:0 0 8px rgba(80,140,255,0.55)}
.q-orb.q-purple{background:radial-gradient(circle at 35% 30%,#d0a0ff,#7040c0);box-shadow:0 0 8px rgba(160,100,255,0.55)}
.q-orb.q-gold{background:radial-gradient(circle at 35% 30%,#ffe890,#c09020);box-shadow:0 0 8px rgba(255,200,80,0.6)}
/* 文字区只占卡牌1/3（插画2/3），用户定 2026-08-16 */
.hand-card .desc{flex:1;font-size:11px;line-height:1.4;padding:4px 6px;text-align:center;display:flex;align-items:center;justify-content:center;overflow:visible;position:relative;z-index:4}
.hand-card .desc-content{display:block;width:100%;min-width:0;white-space:normal;word-break:normal;overflow-wrap:break-word}
.hand-card:hover .desc{z-index:4}
.hand-card .card-notes{font-size:10px;color:#8ab4f8;margin-top:3px}
/* ==================== 暗号：金榜题名（2026-08-18 开发记录见 金榜题名-开发记录.md） ==================== */
/* 小蕾专属卡外框：外框图环绕在卡牌周围（用户定 2026-08-18：只留外框，无背景/边框/内容）
   顶部(-20%)/右侧(7.5%)/左侧(10.5%)；底部(-7%)；底部上移1%：-8% → -7%
   层级：z-index:0 建立层叠上下文 → 外框(2) 在 红框(1) 之上，费用(3) 最上 */
.card.hand-card.face-xiaolei{
  background-color:transparent;
  border:none;
  border-radius:0;
  z-index:0;
}
.card.hand-card.face-xiaolei::before{
  content:'';
  position:absolute;
  z-index:20;
  left:48.5%;
  transform:translateX(-50%);
  top:-20%;
  bottom:-7%;
  width:118%;
  background:url('卡牌样式/小蕾卡牌外框.png') center/100% 100% no-repeat;
  pointer-events:none;
}
/* 费用小圆：右上角小小个金色数字（用户定 2026-08-18，位置可调 top/right）
   注意：必须 left:auto，否则 left:6px+right:7px 会把元素横向拉伸成大椭圆（已踩坑） */
.card.hand-card.face-xiaolei .cost{
  display:inline-block !important;
  position:absolute !important;
  top:7px !important;
  right:7px !important;
  left:auto !important;
  min-width:20px !important;
  height:20px !important;
  line-height:20px !important;
  padding:0 5px !important;
  border-radius:50% !important;
  background:rgba(10,22,40,.88) !important;
  border:1px solid #ffd700 !important;
  color:#ffd700 !important;
  font-size:11px !important;
  font-weight:bold !important;
  text-align:center !important;
  z-index:3 !important;
}
/* 外框卡隐藏内容：类别/品质球/数量 不显示（名字方框+插画区+效果区+费用小圆单独显示） */
.card.hand-card.face-xiaolei .type-badge,
.card.hand-card.face-xiaolei .q-orb-wrap,
.card.hand-card.face-xiaolei .q-orb,
.card.hand-card.face-xiaolei .face-count{display:none}
/* 卡名小方框（用户定 2026-08-18）：手牌内部顶部居中米黄小方框填卡牌名，位置可调 top */
.card.hand-card.face-xiaolei .name{
  display:inline-block !important;
  position:absolute !important;
  top:0px !important;
  left:50% !important;
  right:auto !important;
  transform:translateX(-50%);
  max-width:120px !important;
  background:#f8f1e0 !important;
  border:1px solid rgba(140,105,50,.5) !important;
  border-radius:4px !important;
  color:#5a4630 !important;
  font-size:11px !important;
  font-weight:bold !important;
  padding:1px 8px !important;
  text-align:center !important;
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:clip !important;
  z-index:3 !important;
}
/* 卡面分区（用户定 2026-08-18）：上半=插画区(2/3)，下半=效果区(1/3)，虚线分隔；插画上缩1%、左缩0.5% */
.card.hand-card.face-xiaolei .card-art{
  flex:2;
  background:transparent;
  border-radius:0;
  margin-top:1%;
  margin-left:0.5%;
}
/* 效果区：米黄背景（用户定 2026-08-18），文字加深保证可读 */
.card.hand-card.face-xiaolei .desc{
  flex:1;
  border-top:1.5px dashed rgba(140,105,50,.45);
  background:#f8f1e0;
  color:#5a4630;
}
/* 效果区按卡牌类型配色（用户定 2026-08-18）：逻辑=浅红、思路=浅蓝、解答=深黄、用具=浅绿 */
.card.hand-card.face-xiaolei.logic .desc{background:#f8d4d4}
.card.hand-card.face-xiaolei.idea .desc{background:#d8e8f8}
.card.hand-card.face-xiaolei.answer .desc{background:#f2d06b}
.card.hand-card.face-xiaolei.tool .desc{background:#d8f0dc}
.card.hand-card.face-xiaolei .desc .card-notes{color:#8a6a3a}
.card.hand-card.face-xiaolei .desc .fx-val{color:#a06010}
/* 角色外框通用版：由卡牌所属角色自动匹配素材；新角色默认读取“卡牌样式/角色名卡牌外框.png”。 */
.card.hand-card.face-character-frame{background-color:transparent!important;border:none!important;border-radius:0!important;z-index:0}
.card.hand-card.face-character-frame::before{content:'';position:absolute;z-index:20;left:48.5%;transform:translateX(-50%);top:-20%;bottom:-7%;width:118%;background:var(--character-card-frame) center/100% 100% no-repeat;pointer-events:none}
.card.hand-card.face-character-frame .cost{display:inline-block!important;position:absolute!important;top:7px!important;right:7px!important;left:auto!important;min-width:20px!important;height:20px!important;line-height:20px!important;padding:0 5px!important;border-radius:50%!important;background:rgba(10,22,40,.88)!important;border:1px solid #ffd700!important;color:#ffd700!important;font-size:11px!important;font-weight:bold!important;text-align:center!important;z-index:3!important}
.card.hand-card.face-character-frame .type-badge,.card.hand-card.face-character-frame .q-orb-wrap,.card.hand-card.face-character-frame .q-orb,.card.hand-card.face-character-frame .face-count{display:none}
.card.hand-card.face-character-frame .name{display:inline-block!important;position:absolute!important;top:0!important;left:50%!important;right:auto!important;transform:translateX(-50%);max-width:120px!important;background:#f8f1e0!important;border:1px solid rgba(140,105,50,.5)!important;border-radius:4px!important;color:#5a4630!important;font-size:11px!important;font-weight:bold!important;padding:1px 8px!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;z-index:3!important}
.card.hand-card.face-character-frame .card-art{flex:2;background:transparent!important;border-radius:0;margin-top:1%;margin-left:.5%}
.card.hand-card.face-character-frame .desc{flex:1;border-top:1.5px dashed rgba(140,105,50,.45);background:#f8f1e0!important;color:#5a4630!important;position:relative;z-index:4}
.card.hand-card.face-character-frame.logic .desc{background:#f8d4d4!important}.card.hand-card.face-character-frame.idea .desc{background:#d8e8f8!important}.card.hand-card.face-character-frame.answer .desc{background:#f2d06b!important}.card.hand-card.face-character-frame.tool .desc{background:#d8f0dc!important}.card.hand-card.face-character-frame.trap .desc{background:#d9c8ea!important}
.card.hand-card.face-character-frame .desc .card-notes{color:#8a6a3a}.card.hand-card.face-character-frame .desc .fx-val{color:#a06010}
/* 怪物标准卡面：布局与小蕾专属卡一致，外框区域暂用米黄色双线占位。 */
.card.hand-card.face-standard{background:#fbf1d8!important;border:0!important;border-radius:0;z-index:0;margin:12px 9px 10px}
.card.hand-card.face-standard::before{content:'';position:absolute;z-index:20;left:50%;transform:translateX(-50%);top:-11px;bottom:-11px;width:calc(100% + 18px);border:3px solid #c9ad75;border-radius:10px;box-shadow:inset 0 0 0 2px #f6e6bd,0 0 0 2px #e4cc98;pointer-events:none}
.card.hand-card.face-standard .cost{display:inline-block!important;position:absolute!important;top:7px!important;right:7px!important;left:auto!important;min-width:20px!important;height:20px!important;line-height:20px!important;padding:0 5px!important;border-radius:50%!important;background:#725327!important;border:1px solid #f1d88a!important;color:#fff1b5!important;font-size:11px!important;text-align:center!important;z-index:4!important}
.card.hand-card.face-standard .type-badge,.card.hand-card.face-standard .q-orb-wrap,.card.hand-card.face-standard .q-orb{display:none}
.card.hand-card.face-standard .name{display:inline-block!important;position:absolute!important;top:0!important;left:50%!important;right:auto!important;transform:translateX(-50%);max-width:calc(100% - 48px)!important;background:#f8f1e0!important;border:1px solid rgba(140,105,50,.5)!important;border-radius:4px!important;color:#5a4630!important;font-size:11px!important;padding:1px 8px!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important;z-index:4!important}
.card.hand-card.face-standard .card-art{flex:2;background:transparent!important;border-radius:0;margin-top:1%;margin-left:.5%}.card.hand-card.face-standard .desc{flex:1;border-top:1.5px dashed rgba(140,105,50,.45);position:relative;z-index:3}
/* 数值悬停显示倍数公式 */
.fx-val{color:#ffd700;font-weight:bold;cursor:help;position:relative;border-bottom:1px dotted rgba(255,215,0,0.5)}
.fx-val::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0a1628;color:#ffd700;padding:5px 10px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:80;border:1px solid #ffd700;pointer-events:none;display:none;font-weight:normal}
.fx-val:hover::after{display:block}
/* 拖拽发牌：中间出牌区（用户定 2026-08-18）——默认隐藏，拖拽/点击提示时显现；松手在区内才打出 */
#playZone{position:absolute;left:8%;right:96px;top:24%;height:40%;z-index:2;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(200,225,255,.3);border-radius:12px;background:rgba(13,31,51,.28);opacity:0;pointer-events:none;transition:opacity .15s}
#playZoneLabel{font-size:13px;color:#9ab8d8;letter-spacing:4px}
#battleStage.drag-active #playZone{opacity:1;pointer-events:auto}
#playZone.hint{opacity:1}
#playZone.drop-active{border-color:#ffd700;background:rgba(255,215,0,.1);box-shadow:inset 0 0 24px rgba(255,215,0,.15)}
#playZone.drop-active #playZoneLabel{color:#ffd700}
/* 怪物出牌动作（用户定 2026-08-18）：卡从怪物手牌飞入中间出牌区，短暂展示后淡出；出牌区短暂显现 */
.monster-fly{position:fixed;z-index:150;pointer-events:none;opacity:.95;transition:left .45s ease-in-out,top .45s ease-in-out,opacity .35s ease}
.monster-fly .mhand-big .q-orb-wrap{display:none}
.monster-fly.fade{opacity:0}
#playZone.monster-fx{opacity:1}
#playZone.monster-fx #playZoneLabel{color:#c8a0f0}
/* 怪物出牌翻牌（任务7）：背面飞入→rotateY 翻转为正面→停留→淡出 */
.monster-fly .flip-inner{position:relative;width:120px;height:185px;transform-style:preserve-3d;transition:transform .25s ease}
.monster-fly .flip-back,.monster-fly .flip-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.monster-fly .flip-back{transform:rotateY(0deg)}
.monster-fly .flip-front{transform:rotateY(180deg)}
.monster-fly.flipped .flip-inner{transform:rotateY(180deg)}
.monster-fly .flip-front .card,.monster-fly .flip-back{width:120px;height:185px}
.monster-fly .flip-back::after{font-size:54px}
/* 统一特效层（任务0）：覆盖战斗区，不拦截点击 */
#fxLayer{position:absolute;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.fx-num{position:fixed;z-index:160;pointer-events:none;font-weight:900;font-size:34px;transform:translate(-50%,-50%);animation:fxNum 1s ease-out forwards;
  text-shadow:0 0 3px rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.45)}
/* 重击数字（2026-08-23）：大伤害更大更红，砸落弹跳感 */
.fx-num.crit{font-size:46px;color:#ff4040;text-shadow:0 0 4px #fff,0 0 16px rgba(255,60,60,.75),0 3px 0 rgba(80,0,0,.85);animation:fxNumCrit 1.05s ease-out forwards}
@keyframes fxNumCrit{0%{opacity:0;transform:translate(-50%,-26%) scale(2.2)}16%{opacity:1;transform:translate(-50%,-42%) scale(.96)}30%{transform:translate(-50%,-50%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-175%) scale(1.12)}}
.fx-num.dmg{color:#ff5a5a}
.fx-num.shield{color:#7ec8ff}
.fx-num.true{color:#ff9b3d}
@keyframes fxNum{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.1)}}
.fx-hit{animation:fxHit .4s ease}
@keyframes fxHit{0%,100%{filter:none;transform:none}20%{filter:brightness(1.6) drop-shadow(0 0 6px #ff5a5a);transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fx-shield{animation:fxShield .6s ease}
@keyframes fxShield{0%{box-shadow:0 0 0 0 rgba(126,200,255,0)}30%{box-shadow:0 0 0 6px rgba(126,200,255,.7),inset 0 0 18px rgba(126,200,255,.6)}100%{box-shadow:0 0 0 0 rgba(126,200,255,0)}}
.fx-shield.green{animation:fxShieldGreen .6s ease}

#main.char-select-mode{overflow:hidden;padding:0;display:flex;flex-direction:column}
#app.charselect-full{max-width:100%;background:url('社交/bg_socialclub.png') center 0%/cover no-repeat;background-color:#1a2a3a}
#app.charselect-full #main,#app.charselect-full #topBar,#app.charselect-full #bottomBar{background:transparent;border:none}
#app.charselect-full #bottomBar{min-height:0;padding:0}
/* ===== 选角色页壁纸层（2026-08-23 临时测试：借用三本小说壁纸，切换角色交叉渐变）=====
   层级方案与龙族壁纸 .lz-bg 相同：body 挂 fixed 层 z-index:0 盖住 #app 底图，
   #main 等提为 z-index:1 保证 UI 在壁纸之上；两层 .cw-layer 轮流承载新旧壁纸交叉淡入 */
#charwall{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
#charwall.show{opacity:1}
#charwall .cw-layer{position:absolute;inset:0;background:center 0%/cover no-repeat;opacity:0;transition:opacity .7s ease}
#charwall .cw-layer.on{opacity:1}
/* 暖色薄纱压在壁纸上：保证深色壁纸下的深棕文字可读（嫌亮/嫌暗改这两个透明度即可） */
#charwall .cw-shade{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(244,236,214,.42),rgba(244,236,214,.62))}
#app.charselect-full #topBar,#app.charselect-full #main,#app.charselect-full #bottomBar{position:relative;z-index:1}

/* 生命球使用中心液面显示当前生命，外环保留为装饰。 */
/* 体力改为黄色（2026-08-19 用户需求） */
.energy-dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin:1px;border:2px solid #e8b93a;transition:all 0.2s}
.energy-dot.filled{background:radial-gradient(circle at 35% 30%,#fff3b0,#f5c93a 55%,#d99a18);box-shadow:0 0 6px rgba(245,201,58,.55)}
.energy-dot.empty{background:transparent}
/* 攻击出手：玩家立绘突进（2026-08-19） */
.fx-lunge{animation:fxLunge .42s cubic-bezier(.3,.7,.4,1)}
@keyframes fxLunge{0%{transform:none}35%{transform:translate(14px,-16px) scale(1.05)}100%{transform:none}}
/* 套盾特效：护盾光环扩散 + 盾徽上浮（2026-08-19） */
.fx-shieldring{position:fixed;z-index:150;pointer-events:none;border-radius:50%;border:3px solid rgba(126,200,255,.9);box-shadow:0 0 18px rgba(126,200,255,.55),inset 0 0 14px rgba(126,200,255,.35);transform:translate(-50%,-50%) scale(.4);animation:fxShieldRing .6s ease-out forwards}
@keyframes fxShieldRing{0%{transform:translate(-50%,-50%) scale(.35);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
/* 魔戒绿色环形特效（2026-08-22）：绿色圆环扩散全屏 */
.fx-mojie-ring{position:fixed;z-index:155;pointer-events:none;border-radius:50%;border:4px solid rgba(80,240,120,.95);box-shadow:0 0 30px 12px rgba(80,240,120,.6),inset 0 0 26px rgba(80,240,120,.4);transform:translate(-50%,-50%) scale(.3);animation:fxMojieRing .7s ease-out forwards}
@keyframes fxMojieRing{0%{transform:translate(-50%,-50%) scale(.25);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
.fx-shieldrise{position:fixed;z-index:150;pointer-events:none;font-size:30px;transform:translate(-50%,-50%);animation:fxShieldRise .8s ease-out forwards;text-shadow:0 0 10px rgba(126,200,255,.9)}
@keyframes fxShieldRise{0%{transform:translate(-50%,-20%);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-120%);opacity:0}}

/* Progress bar */
.progress-bar{height:8px;background:#1a2a3a;border-radius:4px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;background:#40a0e0;transition:width 0.3s;border-radius:4px}
.progress-fill.complete{background:#40e060}

/* buff 正方形小图标（2026-08-30 改版）：占位=底色+emoji；用户替换 buff/{key}.png 后显示真实图案 */
.buff-icon{position:relative;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;width:28px;height:28px;border-radius:6px;background:var(--bc,#333);border:1px solid rgba(255,215,0,.65);cursor:help;margin:2px}
.buff-ico{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:5px;z-index:2;pointer-events:none}
.buff-sym{position:absolute;z-index:1;font-size:14px;line-height:1;filter:drop-shadow(0 0 2px rgba(0,0,0,.85));pointer-events:none}
.buff-num{position:absolute;right:1px;bottom:1px;z-index:3;min-width:14px;height:14px;padding:0 3px;box-sizing:border-box;background:linear-gradient(#ef4444,#a40000);color:#fff;font-size:9.5px;font-weight:700;line-height:14px;text-align:center;border-radius:8px;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.buff-icon:hover::after{display:none}
#globalBuffTooltip{display:none;position:fixed;width:250px;box-sizing:border-box;padding:8px 10px;border-radius:7px;background:#081525;color:#f6e7aa;border:1px solid #ffd45c;box-shadow:0 6px 22px rgba(0,0,0,.65);font-size:11px;line-height:1.55;white-space:pre-line;pointer-events:none;z-index:100000}
#globalBuffTooltip.show{display:block}
.attr-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.attr-item{font-size:11px;color:#a0b8d0;background:#0d1f33;padding:3px 8px;border-radius:4px;cursor:help}
.attr-item:hover{color:#ffd700}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a1628;color:#ffd700;padding:16px 32px;border-radius:10px;font-size:18px;font-weight:bold;z-index:100;border:3px solid #ffd700;pointer-events:none;animation:toastIn 0.3s easeOut}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Tier badge */
.tier{font-size:10px;padding:3px 8px;border-radius:10px;color:#fff}
.tier-common{background:#608040}
.tier-uncommon{background:#4060a0}
.tier-rare{background:#6040a0}
.tier-epic{background:#8040a0}
.tier-legendary{background:#a08020}
.tier-mythic{background:#a02020}

/* Modal */

/* ============================================================
   移动端横屏适配（2026-08-29 v0.14.2）
   触发条件：触屏 + 横屏（手机/平板横放）。纯 CSS 覆盖，不改战斗/地图 JS 逻辑。
   ============================================================ */
@media (orientation:landscape) and (pointer:coarse){

  /* ---- 顶栏/底栏压缩，给战斗留出高度 ---- */
  #topBar{min-height:0;padding:6px 10px;gap:8px}
  #topBar .title{font-size:14px}
  #topBar .stat{font-size:11px;padding:2px 8px}
  #bottomBar{min-height:0;padding:5px 10px;gap:8px;font-size:12px}

  /* ---- 战斗页：压缩各区块尺寸，保证一屏放下 ---- */
  #battleStage{padding:4px 8px 2px;gap:6px}
  /* 右侧边栏：横屏下更紧凑，减少垂直堆叠密度 */
  .stage-right{gap:5px;padding:1px 3px 2px;justify-content:center}
  .et-energy{min-width:44px;padding:3px 4px;gap:2px;border-radius:8px}
  .et-energy .et-e-label{font-size:8px;line-height:1}
  .et-energy .et-e-num{font-size:10px}
  .et-energy .energy-dot{width:8px;height:8px;margin:0}
  #endTurnBtn{width:50px;height:50px;font-size:10px}
  #endTurnBtn .eb-icon{font-size:15px}

  .monster-side{width:96px;gap:4px;padding:2px 0 0}
  .player-side{width:96px;gap:4px;padding:2px 0 0}
  /* 战场上下半区留白：怪物手牌与玩家状态之间保持呼吸感 */
  .stage-main{gap:2px}
  #monsterInfo .mhand-count{font-size:9px}
  .monster-piles{gap:4px;margin-top:4px}
  .monster-pile{width:40px;height:58px}
  .monster-pile .pile-label{font-size:8px;padding:2px 0}

  .nexus{width:56px;height:56px}
  #dualNexusStack{gap:13px;padding:15px 0 6px}
  #dualNexusStack{top:calc(-100% + 191px)}
  #dualNexusStack .nexus{width:68px;height:68px}
  #dualNexusStack .nexus-tab{left:calc(100% + 10px)}
  .flaw-ring-svg{left:-15px;top:-15px;width:98px;height:98px}
  .flaw-ring-label{min-width:19px;height:12px;padding:0 2px;font-size:6px}
  .flaw-label-logic{left:0;top:-20px}.flaw-label-idea{right:-15px;top:-20px}.flaw-label-answer{right:-15px;bottom:-20px}.flaw-label-tool{left:0;bottom:-20px}
  .nexus .nexus-tab{font-size:9px;padding:2px 5px}
  .nexus .nexus-shield{font-size:9px;padding:1px 4px}
  .nexus-portrait{min-height:70px}
  .player-mid::before,.monster-mid::before{width:56px;height:56px;flex-basis:56px}
  .nexus-portrait .portrait-emoji{font-size:34px}
  .nexus-portrait .portrait-name{font-size:10px}

  #monsterHandRow{min-height:0;gap:6px;padding:2px 4px 4px}
  #monsterHandRow .mhand-big{width:58px;height:90px}
  #skillRow{gap:3px}
  #skillRow .btn{font-size:9px;padding:4px 5px;white-space:normal}

  #statusRow{max-height:44px;font-size:9px}
  #vitalRow{gap:8px;padding-top:4px;margin-top:4px}
  #handRow{min-height:0}
  #handArea{padding:40px 10px 8px}
  #handArea .hand-card{width:66px;height:104px}
  #handArea .hand-card + .hand-card{margin-left:-4px} /* 横屏手牌近平铺，兼顾清晰与持牌感 */
  #handArea .hand-card .card-art{font-size:32px}
  #handArea .hand-card .name{font-size:10px;top:6px;padding:0 22px}
  #handArea .hand-card .cost{font-size:11px;top:4px;right:4px;left:auto;padding:1px 5px}
  #handArea .hand-card .type-badge{font-size:8px;top:5px;left:4px;right:auto;padding:1px 4px}
  #handArea .card-item-stack{right:3px;top:27px;gap:2px}
  #handArea .card-item-orb{width:19px;height:19px;min-width:19px;font-size:10px;border-width:1px}
  #handArea .hand-card .desc{font-size:8px;padding:2px 4px}
  #handArea .hand-card:hover{transform:rotate(0deg) translateY(-12px) !important;z-index:70}
  #deckZone,#discardZone{width:54px;height:86px}
  .pile-zone .pile-label{font-size:8px;padding:2px 0}

  /* 手牌扇形：横屏下弧高/位移减半，避免卡片顶出战斗区 */
  .hand-card{transform:rotate(var(--fan-rot,0deg)) translateY(calc(var(--fan-y,0px)*0.5)) !important}

  /* 出牌区：横屏时覆盖中部下端，便于拇指拖放 */
  #playZone{left:20%;right:150px;top:auto;bottom:4px;height:34%}

  /* ---- 主菜单 ---- */
  .menu-content{padding-top:12vh}
  .menu-title{font-size:34px;letter-spacing:4px;margin-bottom:4px}
  .menu-logo{width:280px}
  .menu-sub{font-size:12px;margin-bottom:16px}
  .menu-main-btns{bottom:6vh;gap:10px}
  .menu-txt-btn{font-size:19px;padding:7px 12px;letter-spacing:3px}
  .menu-corner{top:10px;right:10px;gap:8px}
  .corner-box{width:58px}
  .corner-box img{width:44px;height:44px}
  .menu-ver{bottom:4px}

  /* ---- 选角色页 ---- */
  .char-select-wrap{gap:6px}
  .avatar-grid{width:30%;gap:4px}
  .avatar-cell{padding:3px}
  .avatar-cell .av-name{font-size:10px}
  .avatar-cell .av-emoji{font-size:22px}
  .char-portrait-frame{width:110px;min-height:0;align-self:stretch}
  .char-portrait-frame .portrait-emoji{font-size:40px}
  .char-info{font-size:10px;line-height:1.6;padding:6px 8px}
  .char-info .ci-name{font-size:13px}

  /* ---- 地图 ---- */
  .map-row{min-width:44px}
  .map-node{width:58px;height:58px;font-size:26px}
  .map-node.boss{width:66px;height:66px;font-size:30px}
  .map-label{font-size:7px;width:52px}
  #mapPanel{left:auto;right:auto;top:auto;bottom:auto;width:98%;height:clamp(225px,51vh,345px);margin:0 auto 2px;padding:10px 12px 10px 132px;border-width:3px}#mapPanel .mp-go-wrap{width:104px}#mapPanel .mp-go{width:92px;height:42px;font-size:11px}

  /* ---- 弹窗 / 卡片网格 ---- */
  .modal-box{width:min(440px,96vw);max-height:90vh}
  .te-fullscreen .te-narr{font-size:15px;min-height:110px;padding:16px 140px 16px 20px}
  .te-fullscreen .te-name{font-size:18px;margin-bottom:10px}
}

/* 竖屏手机下如果页面需要，也把 #app 的高度处理交给浏览器动态栏（dvh 兜底） */
@supports (height:100dvh){ #app{height:100dvh} }

/* ============================================================
   触屏拖拽修复（2026-08-29 v0.14.2）
   手牌区是横向滚动容器，触屏下浏览器默认把滑动当滚动，
   会吞掉 pointermove 导致卡牌拖不动。给手牌禁掉手势，出牌区放行。
   ============================================================ */
@media (pointer:coarse){
  #handArea .hand-card{ touch-action:none }          /* 卡片上拖动=拖牌（禁浏览器手势） */
  #handArea{ touch-action:pan-x }                    /* 空白处滑动=横向查看手牌 */
  #monsterHandRow{ touch-action:pan-x }              /* 怪物手牌：允许横向滑动查看 */
  #playZone{ touch-action:manipulation }             /* 出牌区：禁止双击缩放 */
  #battleStage{ touch-action:manipulation }
  .map-scroll{ touch-action:pan-x }                  /* 地图：允许横向平移 */
  #main{ touch-action:pan-y }                        /* 其他页面：允许纵向滚动，禁缩放 */
}
