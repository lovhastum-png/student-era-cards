<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金榜题名游戏编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091526;color:#dceaff;font:14px/1.5 "Microsoft YaHei",sans-serif;height:100vh;overflow:hidden}button,input,select,textarea{font:inherit}.top{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#10243b;border-bottom:1px solid #31506f}.top h1{font-size:20px;color:#ffd66b;margin-right:auto}.btn{border:1px solid #48729a;border-radius:7px;background:#183653;color:#e8f3ff;padding:8px 13px;cursor:pointer}.btn:hover{background:#285378}.primary{background:#a06d20;border-color:#e6b752;color:#fff}.layout{display:grid;grid-template-columns:170px 280px 1fr;height:calc(100vh - 58px)}.tabs{padding:12px;background:#0d1d30;border-right:1px solid #294664;overflow:auto}.tab{display:block;width:100%;border:0;border-radius:7px;background:transparent;color:#9eb5cc;text-align:left;padding:11px;margin-bottom:5px;cursor:pointer}.tab.on{background:#245078;color:#fff}.listPane{display:flex;flex-direction:column;border-right:1px solid #294664;min-width:0}.search{margin:12px;padding:9px;border:1px solid #365978;border-radius:7px;background:#081525;color:#fff}.items{overflow:auto;padding:0 8px 10px}.item{padding:9px;border-radius:6px;color:#aac0d4;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item:hover,.item.on{background:#1d405f;color:#fff}.editor{overflow:auto;padding:18px 22px}.row{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-bottom:10px;align-items:center}.row label{color:#8faac2}.field,textarea,select{width:100%;border:1px solid #365978;border-radius:6px;background:#081525;color:#e6f0fa;padding:8px}.json{min-height:52vh;font:12px/1.5 Consolas,monospace;resize:vertical}.hint{color:#6f8aa3;font-size:12px;margin:8px 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.status{color:#78dda5;margin-left:8px}.start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.seg{border:2px dashed #4c83b3;border-radius:9px;padding:10px;background:#0c1c2d}.seg input,.seg textarea{margin-top:6px}.seg textarea{height:125px;resize:vertical}.preview{position:fixed;inset:0;z-index:50;background:#030810dd;display:flex;align-items:center;justify-content:center}.previewBox{position:relative;width:min(1100px,96vw);aspect-ratio:16/9;background:#050a10 url('UI/小蕾事件框.png') center/contain no-repeat}.previewSegs{position:absolute;left:5%;right:31%;top:15%;height:39%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.previewSeg{border:2px dashed #3677ad;border-radius:9px;padding:14px;background:#ffffffa8;color:#27445f;white-space:pre-wrap;overflow:auto}.previewOpts{position:absolute;left:5%;right:31%;bottom:8%;display:grid;gap:10px}.previewOpts button{padding:12px}.close{position:absolute;right:12px;top:10px;z-index:2}@media(max-width:900px){.layout{grid-template-columns:130px 220px 1fr}.start-grid{grid-template-columns:1fr}}
.panel{border:1px solid #294e70;border-radius:10px;background:#0c1c2d;padding:14px;margin:0 0 14px}.panel>h3{margin:0 0 12px;color:#ffd66b}.fieldRow{display:grid;grid-template-columns:minmax(120px,180px) 1fr auto;gap:10px;align-items:center;margin:8px 0}.fieldRow>label{color:#9fb8ce}.fieldRow textarea{min-height:80px;resize:vertical}.check{display:flex;align-items:center;gap:8px}.check input{width:18px;height:18px}.nested{border-left:2px solid #284e70;padding-left:14px;margin:10px 0}.nestedHead{display:flex;align-items:center;gap:8px;color:#c7daf0;margin-bottom:6px}.nestedHead b{margin-right:auto}.arrayItem{border:1px dashed #365f83;border-radius:8px;padding:10px;margin:8px 0;background:#091827}.mini{padding:4px 8px;font-size:12px}.keywordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.keyword{padding:9px;border:1px solid #365978;border-radius:7px;background:#10263b}.effectBar{display:flex;gap:8px}.effectBar select{max-width:300px}.advanced summary{cursor:pointer;color:#829db6}.advanced textarea{margin-top:10px}.empty{color:#6f8aa3;padding:8px}.danger{border-color:#86495a;color:#ffc2ce}@media(max-width:900px){.fieldRow{grid-template-columns:1fr}.keywordGrid{grid-template-columns:1fr 1fr}}
.layoutEditorGrid{display:grid;grid-template-columns:minmax(480px,1fr) minmax(300px,.72fr);gap:14px;align-items:start}.layoutEditRow{display:grid;grid-template-columns:155px 1fr 78px 34px;gap:9px;align-items:center;margin:10px 0}.layoutEditRow label{color:#a9c2d8}.layoutEditRow input[type=range]{accent-color:#e6b752}.layoutNum{text-align:center}.layoutPreviewPanel{position:sticky;top:0}.layoutPreviewPanel .hint{margin-bottom:0}#layoutPreview{--lp-ball:65px;--lp-ring:94px;--lp-thick:7px;--lp-gap:11px;--lp-skill-gap:4px;--lp-card-w:58px;--lp-card-h:89px;--lp-overlap:-12px;min-height:510px;border:1px dashed #416887;border-radius:10px;background:linear-gradient(#111d2c 50%,#0b2135 50%);display:flex;flex-direction:column;align-items:center;padding:42px 20px 20px;overflow:hidden}.lp-ball{position:relative;width:var(--lp-ball);height:var(--lp-ball);flex:0 0 var(--lp-ball);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11px;font-style:normal;box-shadow:0 0 0 5px #182738;margin-bottom:var(--lp-gap)}.lp-ball.monster{background:#662b39}.lp-ball.player{background:#1e6077}.lp-ball.monster:before{content:"";position:absolute;width:var(--lp-ring);height:var(--lp-ring);border-radius:50%;background:conic-gradient(#e34f61 0 24%,transparent 24% 25%,#4b9ee8 25% 49%,transparent 49% 50%,#e4b63f 50% 74%,transparent 74% 75%,#55bd78 75% 99%,transparent 99%);mask:radial-gradient(farthest-side,transparent calc(100% - var(--lp-thick)),#000 0);z-index:0}.lp-ball b,.lp-ball span{position:relative;z-index:1}.lp-skills{display:flex;flex-direction:column;gap:var(--lp-skill-gap);width:120px;margin:7px 0 25px}.lp-skills button{border:1px solid #49779c;border-radius:5px;background:#183653;color:#fff;padding:5px}.lp-cards{display:flex;align-items:end;margin-top:auto}.lp-cards em{display:block;width:var(--lp-card-w);height:var(--lp-card-h);border:2px solid #ad8444;border-radius:7px;background:linear-gradient(#344b65 56%,#e7d9b8 56%)}.lp-cards em+em{margin-left:var(--lp-overlap)}@media(max-width:1150px){.layoutEditorGrid{grid-template-columns:1fr}.layoutPreviewPanel{position:static}.layoutEditRow{grid-template-columns:135px 1fr 72px 30px}}
</style></head><body>
<div class="top"><h1>🎓 金榜题名游戏编辑器</h1><button class="btn" onclick="addItem()">新增</button><button class="btn" onclick="duplicateItem()">复制</button><button class="btn primary" onclick="saveItem()">保存当前</button><button class="btn primary" onclick="writeToGame()">写入游戏</button><button class="btn" onclick="exportData()">导出全部</button><label class="btn">导入<input id="importFile" type="file" accept=".json" hidden></label><span id="status" class="status"></span></div>
<div class="layout"><aside class="tabs" id="tabs"></aside><section class="listPane"><input id="search" class="search" placeholder="搜索名称或ID"><div id="items" class="items"></div></section><main class="editor" id="editor"></main></div>
<script>window.G={};</script><script src="js/data.js"></script><script src="js/monsters-expanded.js"></script><script src="js/events-expanded.js"></script><script src="js/dialogues.js"></script><script src="js/editor-overrides.js"></script><script src="js/editor-store.js"></script>
<script type="text/plain" id="legacy-editor">
const META={cards:['卡牌','CARDS'],monsters:['怪物','MONSTERS'],talents:['天赋','TALENTS'],events:['普通事件','EVENTS'],cg:['CG / AVG','CG_EVENTS'],startEvents:['角色开局事件','CHARACTER_START_EVENTS'],audio:['对白配音','DIALOGUE_AUDIO']};let kind='cards',selected=null,working=G.loadEditorOverrides();
function base(k){return G[META[k][1]]||{}}function merged(k){return Object.assign({},base(k),working[k]||{})}function nameOf(x,id){return x.name||x.title||x.text||id}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function boot(){tabs.innerHTML=Object.entries(META).map(([k,v])=>`<button class="tab ${k===kind?'on':''}" onclick="chooseKind('${k}')">${v[0]}</button>`).join('');renderList();}
function chooseKind(k){kind=k;selected=null;boot();editor.innerHTML='<div class="hint">从左侧选择一项开始编辑。</div>'}
function renderList(){let q=search.value.toLowerCase(),all=merged(kind);items.innerHTML=Object.entries(all).filter(([id,x])=>(id+' '+nameOf(x,id)).toLowerCase().includes(q)).map(([id,x])=>`<div class="item ${id===selected?'on':''}" onclick="selectItem('${esc(id)}')">${esc(nameOf(x,id))}<small> · ${esc(id)}</small></div>`).join('')}
function selectItem(id){selected=id;renderList();renderEditor()}
function current(){return JSON.parse(JSON.stringify((working[kind]&&working[kind][selected])||merged(kind)[selected]||{}))}
function renderEditor(){if(!selected)return;let x=current();if(kind==='startEvents')return renderStart(x);editor.innerHTML=`<div class="actions"><b>${esc(META[kind][0])}：${esc(selected)}</b><button class="btn" onclick="deleteItem()">删除本地修改</button></div><div class="row"><label>ID</label><input id="edId" class="field" value="${esc(selected)}"></div><div class="hint">可直接编辑完整 JSON；保存时会校验格式。原始数据不会被删除，修改作为覆盖层保存。</div><textarea id="edJson" class="json" spellcheck="false"></textarea>`;edJson.value=JSON.stringify(x,null,2)}
function renderStart(x){let ds=(x.dialogue||[]).slice(0,3);while(ds.length<3)ds.push({speaker:'',text:'',audio:''});editor.innerHTML=`<div class="actions"><b>角色开局事件：${esc(selected)}</b><button class="btn" onclick="previewStart()">预览小蕾框</button><button class="btn" onclick="deleteItem()">删除本地修改</button></div><div class="row"><label>事件标题</label><input id="stTitle" class="field" value="${esc(x.title||'')}"></div><div class="row"><label>背景图片</label><input id="stImage" class="field" value="${esc(x.image||'')}"></div><div class="row"><label>背景音乐</label><input id="stMusic" class="field" value="${esc(x.music||'')}"></div><h3>上半区三段流式文本</h3><div class="start-grid">${ds.map((d,i)=>`<div class="seg"><b>第${i+1}段</b><input id="sp${i}" value="${esc(d.speaker||'')}" placeholder="说话人"><textarea id="tx${i}" placeholder="对白文本">${esc(d.text||'')}</textarea><input id="au${i}" value="${esc(d.audio||'')}" placeholder="配音文件路径"></div>`).join('')}</div><div class="row" style="margin-top:14px"><label>下半区选项</label><textarea id="stOptions" rows="5" placeholder="每行一个选项">${esc((x.options||['继续']).map(o=>typeof o==='object'?o.text:o).join('\n'))}</textarea></div>`}
function readForm(){if(kind==='startEvents'){return{title:stTitle.value,image:stImage.value,music:stMusic.value,dialogue:[0,1,2].map(i=>({speaker:document.getElementById('sp'+i).value,text:document.getElementById('tx'+i).value,audio:document.getElementById('au'+i).value})),options:stOptions.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}}let x=JSON.parse(edJson.value);return x}
function saveItem(){if(!selected)return;try{let x=readForm(),newId=kind==='startEvents'?selected:(edId.value.trim()||selected);working[kind]=working[kind]||{};if(newId!==selected)delete working[kind][selected];working[kind][newId]=x;selected=newId;G.saveEditorOverrides(working);flash('已保存');boot();renderEditor()}catch(e){alert('JSON格式错误：'+e.message)}}
function addItem(){let id=prompt('输入新ID');if(!id)return;working[kind]=working[kind]||{};working[kind][id]=kind==='startEvents'?{title:'新角色事件',dialogue:[{},{},{}],options:['继续']}:{id:id,name:'新项目'};selected=id;G.saveEditorOverrides(working);boot();renderEditor()}
function duplicateItem(){if(!selected)return;let id=prompt('复制为新ID',selected+'_copy');if(!id)return;working[kind]=working[kind]||{};working[kind][id]=current();selected=id;G.saveEditorOverrides(working);boot();renderEditor()}
function deleteItem(){if(!selected||!confirm('仅删除该项的本地编辑覆盖，原始数据仍保留。确定吗？'))return;if(working[kind])delete working[kind][selected];G.saveEditorOverrides(working);selected=null;boot();editor.innerHTML='<div class="hint">本地修改已删除。</div>'}
function exportData(){let blob=new Blob([JSON.stringify(working,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='金榜题名-编辑器数据.json';a.click();URL.revokeObjectURL(a.href)}
async function writeToGame(){if(!window.showSaveFilePicker){alert('当前浏览器不支持直接写入。请使用“导出全部”，或用最新版 Edge 打开编辑器。');return}try{let h=await showSaveFilePicker({suggestedName:'editor-overrides.js',types:[{description:'游戏编辑覆盖文件',accept:{'text/javascript':['.js']}}]}),w=await h.createWritable();await w.write('// 金榜题名编辑器生成，请勿手改\nG.EDITOR_FILE_OVERRIDES = '+JSON.stringify(working,null,2)+';\n');await w.close();flash('已写入；请确认文件保存在游戏的 js 文件夹')}catch(e){if(e.name!=='AbortError')alert('写入失败：'+e.message)}}
importFile.onchange=async e=>{try{working=JSON.parse(await e.target.files[0].text());G.saveEditorOverrides(working);selected=null;boot();flash('导入成功')}catch(x){alert('导入失败：'+x.message)}};search.oninput=renderList;
function previewStart(){let x=readForm(),opts=x.options||['继续'],cols=opts.length===4?2:Math.min(Math.max(opts.length,1),3);let p=document.createElement('div');p.className='preview';p.innerHTML=`<div class="previewBox"><button class="btn close">关闭</button><div class="previewSegs">${x.dialogue.map(d=>`<div class="previewSeg">${esc((d.speaker?d.speaker+'\n':'')+d.text)}</div>`).join('')}</div><div class="previewOpts" style="grid-template-columns:repeat(${cols},1fr)">${opts.map(o=>`<button class="btn">${esc(o)}</button>`).join('')}</div></div>`;p.querySelector('.close').onclick=()=>p.remove();document.body.appendChild(p)}function flash(t){status.textContent=t;setTimeout(()=>status.textContent='',1800)}boot();editor.innerHTML='<div class="hint">选择左侧项目开始编辑。所有修改保存在浏览器本地，并可导出为JSON备份。</div>';
</script><script src="js/editor-ui.js"></script></body></html>
